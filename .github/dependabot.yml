# Every `uses:` is pinned to a commit SHA, with the version in a trailing
# comment (except the SLSA generator, which must be a tag). Dependabot
# moves both together. Monthly and grouped, so a month's action bumps cost
# one pull request and one CI run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
