name: macOS launcher build

# The macOS launcher, built once on each of two runner versions. Called
# by CI (which also holds the committed launcher to it) and by the
# signing workflow (which signs what this builds). One definition, so
# the two can never build it differently.

on:
  workflow_call:
    inputs:
      check-committed:
        description: Fail unless the committed launcher, signature removed, is this build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.runner }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Two runner versions, because there is no digest to pin and
        # this is the evidence that remains: two different machines,
        # each building once, agreeing with each other and with what is
        # committed.
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    env:
      # The newest Xcode BOTH images carry, by version and build.
      # clang compiles aws-lc's C, ld writes the load commands and the
      # SDK version is stamped into LC_BUILD_VERSION, so another Xcode
      # is expected to give other bytes — 26.4 (17E192) and 26.4.1
      # (17E202) already did. macos-15 stops at 26.3; macos-26 has it as
      # well. Moving this pin moves the hash, in the same commit.
      XCODE_VERSION: "26.3"
      XCODE_BUILD: "17C529"
    steps:
      - uses: actions/checkout@v4

      # Refuse a missing or different Xcode rather than build with the
      # default and report a mismatch that is really a toolchain change.
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not on ${{ matrix.runner }}"
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          build=$(xcodebuild -version | awk '/Build version/{print $3}')
          if [ "$build" != "$XCODE_BUILD" ]; then
            echo "::error::$app is build $build, not ${XCODE_BUILD}"
            exit 1
          fi

      # Kept aside before the build overwrites it, so it can be compared.
      - name: Keep the committed launcher
        run: cp plugins/airdress/launcher/darwin-universal/airdress-launch "$RUNNER_TEMP/committed"

      # rustup reads launcher-src/rust-toolchain.toml; the script adds
      # the two Apple targets for that compiler itself.
      - name: Build once
        env:
          PASSES: "1"
        run: |
          set -euo pipefail
          scripts/build-launcher-macos.sh --write
          shasum -a 256 plugins/airdress/launcher/darwin-universal/airdress-launch

      # Uploaded whether or not anything later matches: a mismatch is
      # read by comparing the bytes, and that needs the bytes.
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-darwin-universal-${{ matrix.runner }}
          path: plugins/airdress/launcher/darwin-universal/airdress-launch
          if-no-files-found: error

      # The committed launcher carries a Developer ID signature, which
      # holds Apple's timestamp and cannot be rebuilt. So compare both
      # without their signatures (scripts/macho-unsigned.py says exactly
      # what that removes), which anybody can repeat.
      - name: The committed launcher is this build, signature aside
        if: inputs.check-committed
        run: |
          set -euo pipefail
          fresh=plugins/airdress/launcher/darwin-universal/airdress-launch
          scripts/macho-unsigned.py "$RUNNER_TEMP/committed" "$RUNNER_TEMP/committed.unsigned"
          scripts/macho-unsigned.py "$fresh" "$RUNNER_TEMP/fresh.unsigned"
          shasum -a 256 "$RUNNER_TEMP/committed.unsigned" "$RUNNER_TEMP/fresh.unsigned"
          cmp "$RUNNER_TEMP/committed.unsigned" "$RUNNER_TEMP/fresh.unsigned" || {
            echo "::error::the committed macOS launcher, signature removed, is not what this source builds with Xcode ${XCODE_VERSION}"
            echo "Run the 'Sign the macOS launcher' workflow and commit what it produces."
            exit 1
          }

  compare:
    name: The two runners agree
    needs: build
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-darwin-universal-*
          path: builds
      - name: Byte-identical
        run: |
          set -euo pipefail
          a=builds/launcher-darwin-universal-macos-15/airdress-launch
          b=builds/launcher-darwin-universal-macos-26/airdress-launch
          sha256sum "$a" "$b"
          cmp "$a" "$b" || {
            echo "::error::macos-15 and macos-26 built different bytes with the same Xcode"
            exit 1
          }
