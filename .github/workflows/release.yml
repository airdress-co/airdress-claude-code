name: Release

# Tag `vX.Y.Z` (equal to plugin.json's version) and this runs. Tags only:
# the Sigstore certificate names this workflow AT THE TAG, which is the
# identity `launcher/pins.json` pins, so a run from a branch would sign
# bundles no launcher accepts.
#
#   build        two passes per platform, `.mcpb` compared (server-build.yml)
#   sign-macos   Developer ID + notarization, in the job that alone holds
#                the Apple secrets; no OIDC token, no write token
#   package      dist/, SHA256SUMS, cosign keyless signatures (Rekor);
#                OIDC token, no secrets, no write token
#   provenance   SLSA provenance from slsa-github-generator's isolated
#                reusable workflow
#   publish      verify everything, then GitHub release (immutable) and the
#                CDN, then download both and compare
#
# Then, by a person: scripts/write-pins.sh, commit, and
# scripts/marketplace-pins.py pin <that commit>, commit. Two commits by
# construction: the pins name artifacts that have to exist first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  preflight:
    name: The tag is the plugin's version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('plugins/airdress/.claude-plugin/plugin.json'))['version'])")
          [ "${GITHUB_REF_NAME}" = "v$version" ] || {
            echo "::error::tag ${GITHUB_REF_NAME} but plugin.json says $version"; exit 1; }

  build:
    name: Build
    needs: preflight
    uses: ./.github/workflows/server-build.yml

  sign-macos:
    name: Sign and notarize the macOS server
    needs: build
    timeout-minutes: 120
    runs-on: macos-26
    # The Apple secrets live in this environment only.
    environment: apple-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-darwin-universal-A
          path: unsigned
      - name: Sign and notarize
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p signed
          cp unsigned/airdress-mcp signed/airdress-mcp
          scripts/sign-macos.sh signed/airdress-mcp
      # The claim the README makes, made here: with the signature aside,
      # what ships is the build both runners agreed on.
      - name: Signature aside, it is the build
        run: |
          set -euo pipefail
          scripts/macho-unsigned.py unsigned/airdress-mcp "$RUNNER_TEMP/unsigned.form"
          scripts/macho-unsigned.py signed/airdress-mcp "$RUNNER_TEMP/signed.form"
          cmp "$RUNNER_TEMP/unsigned.form" "$RUNNER_TEMP/signed.form" || {
            echo "::error::signing changed more than the signature"; exit 1; }
      - name: Package the signed bundle
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          export SOURCE_DATE_EPOCH
          python3 scripts/package-mcpb.py --platform darwin-universal \
            --server signed/airdress-mcp \
            --version "${{ needs.build.outputs.version }}" \
            --include LICENSE --include NOTICE \
            --out signed/airdress-darwin-universal.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: signed-darwin-universal
          path: signed/airdress-darwin-universal.mcpb
          if-no-files-found: error

  package:
    name: Package and sign (Sigstore)
    needs: [build, sign-macos]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # cosign keyless: the certificate names this workflow at this tag
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - name: Assemble dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          cp builds/server-linux-x86_64-A/airdress-linux-x86_64.mcpb dist/
          cp builds/server-linux-aarch64-A/airdress-linux-aarch64.mcpb dist/
          cp builds/signed-darwin-universal/airdress-darwin-universal.mcpb dist/
          (cd dist && sha256sum *.mcpb > SHA256SUMS)
          cat dist/SHA256SUMS
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > dist/NOTES.md
      - uses: sigstore/cosign-installer@v3
      - name: Sign every bundle, recorded in Rekor
        run: |
          set -euo pipefail
          for f in dist/*.mcpb dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      # Verified here, with exactly what the launcher will pin, before
      # anything is published: an identity that does not match is a
      # release no launcher would start.
      - name: Verify as the launcher will
        run: |
          set -euo pipefail
          for f in dist/*.mcpb dist/SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$f"
          done
      - id: subjects
        run: echo "subjects=$(cd dist && sha256sum *.mcpb | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # SLSA provenance from the generic generator: an isolated reusable
  # workflow signs it, so a build step cannot forge it. Its documentation
  # claims Build L3 for that arrangement; what this release reaches is
  # stated in the notes, not here (the macOS bundle is changed by the
  # signing job after the compared build, and that job is ours).
  provenance:
    name: Provenance
    needs: package
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.package.outputs.subjects }}
      provenance-name: airdress-claude-code.intoto.jsonl
      upload-assets: false

  publish:
    name: Publish to both origins
    needs: [package, provenance]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the GitHub release
      id-token: write   # WIF to the CDN publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist
      - uses: sigstore/cosign-installer@v3
      - uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1
      - name: Verify signatures and provenance before publishing
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          for f in *.mcpb SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
          done
          slsa-verifier verify-artifact *.mcpb \
            --provenance-path airdress-claude-code.intoto.jsonl \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "${GITHUB_REF_NAME}"

      # Draft first, assets attached, then published: with immutable
      # releases on, publishing is what locks the assets and the tag.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/*.mcpb dist/*.sigstore.json dist/SHA256SUMS \
            dist/airdress-claude-code.intoto.jsonl \
            --draft --verify-tag --title "$tag" --notes-file dist/NOTES.md
          gh release edit "$tag" --draft=false
          immutable=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.immutable')
          if [ "$immutable" != "true" ]; then
            echo "::error::the release was published but is NOT immutable: turn on immutable releases for this repository (Settings → General → Releases). Its assets could be replaced; the signatures would still refuse a replacement, but the public record would not hold."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.RELEASE_PUBLISHER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # The publisher may create under claude-code/ and never overwrite,
      # and --no-clobber says the same from this side.
      - name: Our CDN
        run: |
          set -euo pipefail
          gcloud storage cp --no-clobber \
            --cache-control="public, max-age=31536000, immutable" \
            dist/*.mcpb dist/*.sigstore.json dist/SHA256SUMS dist/airdress-claude-code.intoto.jsonl \
            "gs://${{ vars.DOWNLOADS_BUCKET }}/claude-code/${GITHUB_REF_NAME}/"

      # Byte-identical from either origin, fetched as a user would.
      - name: Both origins serve the same verified bytes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p from-cdn from-github
          for f in $(cd dist && ls *.mcpb *.sigstore.json SHA256SUMS); do
            curl -fsSL -A airdress-launch -o "from-cdn/$f" "https://downloads.airdress.co/claude-code/$tag/$f"
            curl -fsSL -A airdress-launch -o "from-github/$f" "https://github.com/${{ github.repository }}/releases/download/$tag/$f"
            cmp "dist/$f" "from-cdn/$f"
            cmp "dist/$f" "from-github/$f"
          done
          for f in from-cdn/*.mcpb; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
          done
          echo "both origins serve the signed, byte-identical release"

      - name: What has to happen next
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MSG'
          ### Published — not installable until pinned

          1. `scripts/write-pins.sh <tag>` with this run's `dist/` (`gh run download <run> -n dist -D dist`)
          2. commit `plugins/airdress/launcher/pins.json` on main
          3. `scripts/marketplace-pins.py pin <that commit>`, commit `.claude-plugin/marketplace.json`
          MSG
