name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin manifest and docs
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The manifest, as the harness reads it. `--strict` is the point:
      # a plugin that merely parses can still be one the marketplace
      # refuses, and finding that out at install time is finding out in
      # front of a user.
      # Both manifests, because `validate .` at the root reads the
      # marketplace and `validate plugins/airdress` reads the plugin, and
      # a marketplace that validates can still point at a plugin that
      # does not. Measured 2026-10-03: the root call reports only
      # "Validating marketplace manifest".
      - name: Validate the marketplace
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate --strict .
      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate --strict plugins/airdress

      - name: The two manifests agree
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          plugin = json.loads(
              pathlib.Path("plugins/airdress/.claude-plugin/plugin.json").read_text()
          )

          # One plugin, one marketplace, and neither named after anybody
          # else's product (FR-2).
          assert market["name"] == "airdress", market["name"]
          assert len(market["plugins"]) == 1, market["plugins"]
          assert market["plugins"][0]["name"] == plugin["name"]
          for forbidden in ("claude", "anthropic", "official"):
              for name in (market["name"], plugin["name"]):
                  assert forbidden not in name.lower(), f"{name} contains {forbidden}"

          # Every command the manifest names must exist, and every file
          # in commands/ must be named: two lists that stop agreeing is
          # the defect this project keeps paying for elsewhere.
          declared = set(plugin["commands"])
          on_disk = {p.stem for p in pathlib.Path("plugins/airdress/commands").glob("*.md")}
          assert declared == on_disk, f"declared {sorted(declared)}, on disk {sorted(on_disk)}"

          # No skill (D-33): the rules a model must always follow are in
          # the server's `instructions`, which a harness always loads.
          assert not pathlib.Path("plugins/airdress/skills").exists(), "a skills/ appeared"
          # No top-level bin/: claude.ai and Cowork refuse a plugin with one.
          assert not pathlib.Path("bin").exists(), "a top-level bin/ appeared"

          # Shell-session hooks: every one is inert outside a shell
          # session (its first act is to exit when the host set no
          # socket), runs only `airdress shell events`, and the permission
          # hook outlasts the host's 120 s wait for the person's tap.
          hooks = json.loads(pathlib.Path("plugins/airdress/hooks/hooks.json").read_text())["hooks"]
          guard = '[ -n "$AIRDRESS_SHELL_SOCKET" ] || exit 0;'
          for event, groups in hooks.items():
              for g in groups:
                  for h in g["hooks"]:
                      assert h["type"] == "command", (event, h)
                      assert h["command"].startswith(guard), (event, h["command"])
                      assert h["command"].endswith("exec airdress shell events"), (event, h["command"])
          perm = hooks["PermissionRequest"][0]["hooks"][0]
          assert perm["timeout"] > 120, perm

          print(f"{len(declared)} commands, {len(hooks)} hook events, manifest consistent")
          PY

      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

      - uses: streetsidesoftware/cspell-action@v6
        with:
          incremental_files_only: false

  hygiene:
    name: Public hygiene
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-public.sh

      # The gitleaks BINARY, pinned and checksummed — not
      # `gitleaks/gitleaks-action`, which refuses to run for an
      # organisation without a paid licence. The tool itself is MIT;
      # only that action is licensed. Running the binary is also one
      # less third-party action with a token in a public repository's
      # CI.
      - name: Secrets, over the whole history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks git --redact -v .
          rm -f gitleaks "$tarball"

      # Document numbers belong in comments and prose, never in a path.
      # This repository has no code that addresses one by name, so the
      # check is the path rule alone.
      - name: Document numbers stay out of paths
        run: |
          if git ls-files | grep -Ei '(spec|rdr|rcp)[_-]?[0-9]{3}' | grep -v '\.md$'; then
            echo "A document number belongs in a comment, not in a file name." >&2
            exit 1
          fi
          echo "no document numbers in paths"

  launcher:
    name: Launcher
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher-src
      - run: cargo fmt --manifest-path launcher-src/Cargo.toml --check
      - run: cargo clippy --manifest-path launcher-src/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path launcher-src/Cargo.toml

      # No telemetry, in the launcher or anything it pulls in (FR-112).
      # The pinned binary rather than the action, for the same reason the
      # CLI uses it: the action runs in a container, which is one more
      # moving part in a job that is about what this tree depends on.
      - name: Licences, advisories, bans and sources
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          tarball="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${tarball}"
          echo "${DENY_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" --strip-components=1 \
            "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          ./cargo-deny --manifest-path launcher-src/Cargo.toml \
            check licenses advisories bans sources
          rm -f cargo-deny "$tarball"

  reproducible:
    name: The launcher reproduces in its pinned toolchain
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Both Linux platforms, inside the digest-pinned images named in
      # launcher-src/toolchain-images.json. Docker is already on the
      # runner, so there is nothing to install — and nothing to install
      # is the point: the C toolchain comes from the image, which is
      # what makes two machines agree.
      #
      # This replaces a job that built x86_64 only with the runner's own
      # `musl-tools`. That job proved determinism on one machine, which
      # is strictly weaker than FR-69 asks, and it could not build
      # aarch64 at all: `aws-lc-sys` wants cmake and libclang as well as
      # a musl cross compiler, and `musl-tools` + `gcc-aarch64-linux-gnu`
      # supplies none of the three.
      # ONE pass per platform, compared against hashes another machine
      # produced from the same pinned images. That is deliberately not
      # the same as building twice here: a second pass on one runner
      # proves determinism, while matching the other machine's bytes proves the
      # thing FR-69 actually asks for — that somebody else can rebuild
      # the committed binary and get what is committed.
      #
      # Recorded 2026-10-04 on a second machine (Docker 28.5.2), both platforms
      # built twice there, byte-identical each time. When the launcher
      # source or a pinned image changes these must change in the same
      # commit; `scripts/build-launchers.sh` prints the new values, and
      # a pin bump is expected to move every hash.
      - name: The bytes match what another machine produced
        env:
          PASSES: "1"
        run: |
          set -euo pipefail
          scripts/build-launchers.sh --write
          declare -A expected=(
            [linux-x86_64]=18ac3d9adcbb3fb0098965917890ede9c0134d584ce84d7308ca1b03512f1175
            [linux-aarch64]=c7f780812b52524cae0171f2d38aea43f001a50d352cb05766f082df613b4277
          )
          fail=0
          for platform in "${!expected[@]}"; do
            got=$(sha256sum "plugins/airdress/launcher/$platform/airdress-launch" | cut -d" " -f1)
            if [ "$got" != "${expected[$platform]}" ]; then
              echo "::error::$platform does not match the recorded cross-machine hash"
              echo "  recorded elsewhere:  ${expected[$platform]}"
              echo "  built on this runner:  $got"
              fail=1
            else
              echo "$platform matches: $got"
            fi
          done
          [ "$fail" -eq 0 ]

      # The committed binaries must BE the ones just built. If they are
      # not, somebody edited the source without rebuilding, and the
      # plugin would ship a launcher nobody can reproduce.
      - name: The committed launchers are the reproduced ones
        run: git diff --exit-code -- plugins/airdress/launcher || {
            echo "::error::the committed launchers differ from a fresh reproducible build";
            echo "Run scripts/build-launchers.sh --write and commit the result.";
            exit 1;
          }

  # The macOS launcher, on two runner versions, held to what is
  # committed with the signature aside. The steps live in
  # macos-launcher-build.yml so the signing workflow builds it the same
  # way.
  reproducible-macos:
    name: The macOS launcher reproduces
    uses: ./.github/workflows/macos-launcher-build.yml
    with:
      check-committed: true
