[package]
name = "airdress-launch"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Verifies and runs the Airdress MCP server bundle a plugin pins"
license = "Apache-2.0"
publish = false

[[bin]]
name = "airdress-launch"
path = "src/main.rs"

[dependencies]
# HTTP. `ureq` rather than a larger client for one reason that is also a
# requirement: it has no cookie jar and sends no header we did not write,
# so "nothing identifying leaves this machine" is a property of the
# library and not only of our care (FR-120).
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
# Offline Sigstore verification: Fulcio chain, certificate identity,
# signature, Rekor inclusion proof against the embedded trust root.
# Offline verification only: the Fulcio chain, the certificate identity,
# the signature and Rekor's inclusion proof, against an embedded trust
# root. No TUF refresh (that is `sigstore-trust-root`, deliberately
# absent).
#
# `rustls-tls` is kept, and not because this program makes HTTPS calls —
# it fetches with `ureq`. Without it `sigstore`'s certificate
# verification falls through to `ring`, and `rustls-webpki` pulls
# `aws-lc-sys` either way: **this crate's verification path depends on a
# C library whichever backend is chosen** (measured 2026-10-04, trying
# to remove it). That is what stops the committed binaries being
# byte-identical across machines, because a C library's object code
# depends on the builder's C compiler. See CHANGELOG and SPEC-133's
# FR-69/FR-74.
sigstore = { version = "0.14", default-features = false, features = [
    "bundle",
    "verify",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# A launcher runs before every session, so it is built for size and
# start-up rather than throughput.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
