# SonarQube Cloud, run from CI (the "Launcher" job in ci.yml), not
# Automatic Analysis: only a CI scan can import coverage. The two are
# exclusive, so Automatic Analysis is off for this project.
sonar.projectKey=airdress-co_airdress-claude-code
sonar.organization=airdress-co

sonar.sources=.
# The committed launcher binaries are not source, and the trust root is
# Sigstore's file, refreshed by a reviewed commit (scripts/refresh-trust-root.sh).
# plugins/airdress/launcher/launch.sh stays in: it ships to every user.
sonar.exclusions=launcher-src/target/**,lcov.info,plugins/airdress/launcher/*/airdress-launch,plugins/airdress/launcher/trust/**

# Written by `cargo llvm-cov --lcov` in the same job.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.cargo.manifestPaths=launcher-src/Cargo.toml

# The Rust analyzer runs clippy itself unless told not to. The Launcher job
# already runs clippy with -D warnings, so a second run would only rebuild
# the launcher for findings CI has refused already. the SonarQube Rust
# rules still run.
sonar.rust.clippy.enabled=false
